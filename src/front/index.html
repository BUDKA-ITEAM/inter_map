<!DOCTYPE html>
<html lang="ru" data-theme="white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light dark">
    <title>Навигатор по этажам</title>
    <link rel="icon" type="image/jpeg" href="img/xd.jpg">
    <link rel="apple-touch-icon" href="img/icon-180.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#212429" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Навигатор">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="app.css">
    <link rel="preload" as="image" href="img/icons.svg" type="image/svg+xml">
</head>
<body class="h-dvh flex justify-center items-center bg-bg font-app text-ink
            overflow-hidden text-[14px] antialiased
            max-tab:items-stretch
            short:overflow-y-auto short:h-auto">

    <button id="sidebar-toggle" aria-label="Открыть настройки" aria-expanded="false" aria-controls="sidebar"
            class="fixed top-3 left-3 z-20 flex items-center justify-start gap-2
                   w-[46px] h-[46px] px-[13px] py-0 overflow-hidden whitespace-nowrap
                   bg-surface border border-border-strong rounded-control shadow-card
                   text-ink cursor-pointer
                   transition-[width,background-color,border-color,color] duration-250 ease-[var(--ease)]
                   active:bg-surface-active
                   focus-visible:w-[140px] focus-visible:bg-accent focus-visible:border-accent focus-visible:text-on-accent
                   focus-visible:[&_.label]:opacity-100 focus-visible:[&_.label]:delay-80
                   mouse:hover:w-[140px] mouse:hover:bg-accent mouse:hover:border-accent mouse:hover:text-on-accent
                   mouse:hover:[&_.label]:opacity-100 mouse:hover:[&_.label]:delay-80
                   tab:sidebar-shown:hidden max-tab:sidebar-open:hidden
                   short:top-1 short:left-1"><svg class="size-5 shrink-0 [stroke-width:1.75]" aria-hidden="true" focusable="false"><use href="img/icons.svg#menu"/></svg><span class="label text-[13px] font-medium opacity-0 transition-opacity duration-150 ease-[ease]">Настройки</span></button>

    <aside id="sidebar" aria-label="Настройки расписания"
           class="fixed z-15 flex flex-col gap-6 box-border overflow-y-auto
                  top-[var(--sidebar-inset)] left-[var(--sidebar-inset)]
                  w-[var(--sidebar-width)] h-[calc(100%_-_var(--sidebar-inset)*2)]
                  bg-surface border border-border rounded-panel shadow-card p-5
                  tab:[transition:transform_var(--duration-drawer-in)_var(--ease-drawer)]
                  tab:aria-hidden:[transform:translateX(calc(-100%_-_var(--sidebar-inset)_-_4px))]
                  tab:aria-hidden:invisible
                  tab:aria-hidden:[transition:transform_var(--duration-drawer-out)_var(--ease-drawer),visibility_0s_linear_var(--duration-drawer-out)]
                  tab:[&.open]:[transition:transform_var(--duration-drawer-in)_var(--ease-drawer),visibility_0s]
                  max-tab:top-0 max-tab:left-0 max-tab:w-[min(288px,86vw)] max-tab:h-full
                  max-tab:border-y-0 max-tab:border-l-0 max-tab:border-r max-tab:border-r-border
                  max-tab:rounded-none max-tab:shadow-none max-tab:pt-[56px]
                  max-tab:[&:not(.open)]:[transform:translateX(-100%)]
                  max-tab:[&:not(.open)]:invisible
                  max-tab:[transition:transform_var(--duration-drawer-out)_var(--ease-drawer),box-shadow_var(--duration-drawer-out)_linear,visibility_0s_linear_var(--duration-drawer-out)]
                  max-tab:[&.open]:shadow-sheet
                  max-tab:[&.open]:[transition:transform_var(--duration-drawer-in)_var(--ease-drawer),box-shadow_var(--duration-drawer-in)_linear,visibility_0s]
                  [&.open>*]:animate-[sidebar-item-in_var(--duration-base)_var(--ease-drawer)_both]
                  [&.open>*:nth-child(1)]:[animation-delay:0.06s]
                  [&.open>*:nth-child(2)]:[animation-delay:0.10s]
                  [&.open>*:nth-child(3)]:[animation-delay:0.14s]
                  [&.open>*:nth-child(4)]:[animation-delay:0.18s]
                  [&.open>*:nth-child(5)]:[animation-delay:0.22s]
                  [&.open>*:nth-child(6)]:[animation-delay:0.26s]">
        <h3 class="m-0 text-[18px] font-semibold tracking-[-0.01em] text-ink">Настройки</h3>

        <div class="flex flex-col gap-[10px]">
            <span class="flex items-center gap-[6px] text-[11px] font-semibold uppercase tracking-[0.08em] text-ink-secondary" id="view-switch-label">
                <svg class="size-4 shrink-0 text-ink [stroke-width:2.1]" aria-hidden="true" focusable="false"><use href="img/icons.svg#calendar-range"/></svg>Расписание
            </span>
            <div class="flex gap-[2px]" role="group" aria-labelledby="view-switch-label">
                <span class="is-active flex-1 inline-flex items-center justify-center
                             min-h-10 py-[10px] px-[14px] rounded-control
                             bg-tag-orange text-on-tag-orange
                             text-[13px] font-semibold tracking-[0.01em] text-center
                             cursor-default select-none
                             transition-colors duration-150 ease-[ease]
                             mouse:hover:shadow-card" aria-current="page">На день</span>
                <!-- <button id="week-details-btn" type="button" class="flex-1 inline-flex items-center justify-center min-h-10 py-[7px] px-2 rounded-control bg-transparent border-none text-ink-secondary text-[13px] font-medium text-center cursor-pointer select-none transition-colors duration-150 ease-[ease] mouse:hover:bg-surface-hover mouse:hover:text-ink" aria-label="Открыть расписание на неделю">На неделю</button> -->
            </div>
        </div>
        <div class="flex flex-col gap-[10px]" id="group-picker">
            <span class="flex items-center gap-[6px] text-[11px] font-semibold uppercase tracking-[0.08em] text-ink-secondary">
                <svg class="size-4 shrink-0 text-ink [stroke-width:2.1]" aria-hidden="true" focusable="false"><use href="img/icons.svg#users"/></svg>Группа
            </span>

            <!-- состояние 1: группа ещё не выбрана -->
            <button id="group-pick-btn" type="button"
                    class="w-full inline-flex items-center justify-center gap-2
                           min-h-11 py-[10px] px-4 rounded-control
                           text-[13px] font-semibold cursor-pointer
                           bg-accent text-on-accent border border-accent
                           transition-[background-color,border-color,scale] duration-150 ease-[ease]
                           active:enabled:scale-[0.98]
                           disabled:bg-surface-active disabled:text-ink-tertiary
                           disabled:border-border disabled:cursor-not-allowed
                           mouse:hover:enabled:bg-accent-hover mouse:hover:enabled:border-accent-hover
                           max-tab:min-h-12 max-tab:text-[14px]">
                <svg class="size-4 shrink-0 [stroke-width:2.1]" aria-hidden="true" focusable="false"><use href="img/icons.svg#users"/></svg>Выбрать группу
            </button>


            <!-- Состояние 2: выбор. сначала направление, затем группа —
                 оба обычные селекторы. кнопка внизу неактивна, пока группа
                 не выбрана. -->
            <div id="group-picker-panel" class="flex flex-col gap-[6px]" hidden>
                <label for="direction-select"
                       class="block m-0 text-[12px] font-medium normal-case tracking-normal text-ink-secondary">Направление</label>
                <span class="select-wrap mb-2 relative block
                             after:absolute after:top-1/2 after:right-3
                             after:size-[14px] after:-translate-y-1/2 after:bg-ink-secondary
                             after:[mask:var(--icon-chevron)_center/contain_no-repeat]
                             after:pointer-events-none after:transition-colors after:duration-150 after:ease-[ease]
                             focus-within:after:bg-tag-orange
                             has-[select:disabled]:after:opacity-50">
                    <select id="direction-select"
                            class="w-full min-h-11 py-[10px] pr-[38px] pl-3 mb-0 box-border
                                   border border-border rounded-control
                                   bg-surface text-ink text-[13px] font-medium [font-family:inherit]
                                   cursor-pointer appearance-none [-webkit-appearance:none] shadow-card
                                   transition-[border-color,background-color,box-shadow] duration-150 ease-[ease]
                                   focus-visible:outline-none focus-visible:border-tag-orange
                                   focus-visible:shadow-[0_0_0_3px_var(--tag-orange-soft)]
                                   disabled:opacity-60 disabled:cursor-not-allowed disabled:shadow-none
                                   mouse:hover:enabled:border-border-strong
                                   max-tab:min-h-12 max-tab:text-[14px]">
                        <option value="">Не выбрано</option>
                    </select>
                </span>

                <label for="group-select"
                       class="block m-0 text-[12px] font-medium normal-case tracking-normal text-ink-secondary">Группа</label>
                <span class="select-wrap mb-1 relative block
                             after:absolute after:top-1/2 after:right-3
                             after:size-[14px] after:-translate-y-1/2 after:bg-ink-secondary
                             after:[mask:var(--icon-chevron)_center/contain_no-repeat]
                             after:pointer-events-none after:transition-colors after:duration-150 after:ease-[ease]
                             focus-within:after:bg-tag-orange
                             has-[select:disabled]:after:opacity-50">
                    <select id="group-select" disabled
                            class="w-full min-h-11 py-[10px] pr-[38px] pl-3 mb-0 box-border
                                   border border-border rounded-control
                                   bg-surface text-ink text-[13px] font-medium [font-family:inherit]
                                   cursor-pointer appearance-none [-webkit-appearance:none] shadow-card
                                   transition-[border-color,background-color,box-shadow] duration-150 ease-[ease]
                                   focus-visible:outline-none focus-visible:border-tag-orange
                                   focus-visible:shadow-[0_0_0_3px_var(--tag-orange-soft)]
                                   disabled:opacity-60 disabled:cursor-not-allowed disabled:shadow-none
                                   mouse:hover:enabled:border-border-strong
                                   max-tab:min-h-12 max-tab:text-[14px]">
                        <option value="">Сначала выберите направление</option>
                    </select>
                </span>

                <button id="group-confirm-btn" type="button" disabled
                        class="w-full inline-flex items-center justify-center gap-2
                               min-h-11 py-3 px-4 rounded-control
                               text-[13px] font-semibold cursor-pointer
                               bg-accent text-on-accent border border-accent
                               transition-[background-color,border-color,scale] duration-150 ease-[ease]
                               active:enabled:scale-[0.98]
                               disabled:bg-surface-active disabled:text-ink-tertiary
                               disabled:border-border disabled:cursor-not-allowed
                               mouse:hover:enabled:bg-accent-hover mouse:hover:enabled:border-accent-hover
                               max-tab:min-h-12 max-tab:text-[14px]">
                    <svg class="size-4 shrink-0 [stroke-width:2.1]" aria-hidden="true" focusable="false"><use href="img/icons.svg#circle-check"/></svg>Выбрать группу
                </button>
            </div>

            <!-- состояние 3: группа выбрана -->
            <div id="group-current" hidden
                 class="flex items-center justify-between flex-wrap gap-2
                        py-2 pr-[10px] pl-3 bg-accent-soft border border-border rounded-control">
                <svg class="size-4 shrink-0 [stroke-width:2.1]" aria-hidden="true" focusable="false"><use href="img/icons.svg#circle-check"/></svg>
                <span id="group-current-name"
                      class="flex-auto min-w-0 [overflow-wrap:anywhere] text-[14px] font-semibold text-ink"></span>
                <button id="group-change-btn" type="button"
                        class="w-auto flex-none ml-auto inline-flex items-center gap-[5px]
                               py-[6px] px-[10px] rounded-full
                               bg-transparent text-ink-secondary border border-border-strong
                               text-[11px] font-medium cursor-pointer
                               transition-colors duration-150 ease-[ease]
                               mouse:hover:bg-surface mouse:hover:text-ink
                               max-tab:py-2 max-tab:px-3 max-tab:text-[12px]">
                    <svg class="size-[13px] shrink-0 text-ink [stroke-width:2.5]" aria-hidden="true" focusable="false"><use href="img/icons.svg#pencil"/></svg>Изменить группу
                </button>
            </div>


            <p id="group-status" role="status" aria-live="polite"
               class="m-0 text-[12px] leading-[1.4] text-ink-tertiary
                      empty:hidden
                      [&.is-error:not(:empty)]:flex [&.is-error]:items-start [&.is-error]:gap-[6px]
                      [&.is-error]:text-danger
                      [&.is-error]:before:mt-[2px] [&.is-error]:before:size-[13px]
                      [&.is-error]:before:shrink-0 [&.is-error]:before:bg-danger
                      [&.is-error]:before:[mask:var(--icon-alert)_center/contain_no-repeat]"></p>
        </div>

        <div class="flex flex-col gap-[10px]">
            <span class="flex items-center gap-[6px] text-[11px] font-semibold uppercase tracking-[0.08em] text-ink-secondary" id="date-panel-label">
                <svg class="size-4 shrink-0 text-ink [stroke-width:2.1]" aria-hidden="true" focusable="false"><use href="img/icons.svg#calendar-days"/></svg>Дата
            </span>

            <div id="date-panel" role="group" aria-labelledby="date-panel-label"
                 class="flex flex-col items-stretch gap-2 p-0 shrink-0">
                <input type="date" id="date-input" aria-label="Дата"
                       class="w-full min-w-0 min-h-11 py-[11px] px-3 border border-border rounded-control
                              text-[14px] font-semibold [font-family:inherit] text-center
                              bg-surface text-ink shadow-card
                              transition-[border-color,background-color,box-shadow] duration-150 ease-[ease]
                              focus-visible:outline-none focus-visible:border-tag-orange
                              focus-visible:shadow-[0_0_0_3px_var(--tag-orange-soft)]
                              mouse:hover:border-border-strong mouse:hover:bg-surface-hover
                              [&::-webkit-calendar-picker-indicator]:p-[3px]
                              [&::-webkit-calendar-picker-indicator]:rounded-md
                              [&::-webkit-calendar-picker-indicator]:opacity-70
                              [&::-webkit-calendar-picker-indicator]:cursor-pointer
                              [&::-webkit-calendar-picker-indicator]:transition-[opacity,background-color]
                              [&::-webkit-calendar-picker-indicator]:duration-150
                              [&::-webkit-calendar-picker-indicator]:ease-[ease]
                              [&::-webkit-calendar-picker-indicator:hover]:opacity-100
                              [&::-webkit-calendar-picker-indicator:hover]:bg-surface-hover
                              dark:[&::-webkit-calendar-picker-indicator]:[filter:invert(1)_brightness(0.9)]">
                <div class="flex gap-2">
                    <button id="prev-day" type="button"
                            class="inline-flex items-center justify-center flex-1 w-auto min-h-10 gap-[6px] px-[6px] py-0
                                   bg-surface text-ink-secondary border border-border rounded-full
                                   text-[12px] font-medium cursor-pointer
                                   transition-[background-color,border-color,color,scale] duration-150 ease-[ease]
                                   active:scale-[0.97] active:bg-surface-active
                                   mouse:hover:bg-surface-hover mouse:hover:border-border-strong mouse:hover:text-ink
                                   max-tab:min-h-11"><svg class="size-4 shrink-0 [stroke-width:2.1]" aria-hidden="true" focusable="false"><use href="img/icons.svg#chevron-left"/></svg>Назад</button>
                    <button id="next-day" type="button"
                            class="inline-flex items-center justify-center flex-1 w-auto min-h-10 gap-[6px] px-[6px] py-0
                                   bg-surface text-ink-secondary border border-border rounded-full
                                   text-[12px] font-medium cursor-pointer
                                   transition-[background-color,border-color,color,scale] duration-150 ease-[ease]
                                   active:scale-[0.97] active:bg-surface-active
                                   mouse:hover:bg-surface-hover mouse:hover:border-border-strong mouse:hover:text-ink
                                   max-tab:min-h-11">Вперёд<svg class="size-4 shrink-0 [stroke-width:2.1]" aria-hidden="true" focusable="false"><use href="img/icons.svg#chevron-right"/></svg></button>
                </div>
            </div>
        </div>


        <div class="flex flex-col gap-[10px]">
            <span class="flex items-center gap-[6px] text-[11px] font-semibold uppercase tracking-[0.08em] text-ink-secondary">
                <svg class="size-4 shrink-0 text-ink [stroke-width:2.1]" aria-hidden="true" focusable="false"><use href="img/icons.svg#contrast"/></svg>Оформление
            </span>
            <label for="theme-toggle"
                   class="relative flex items-center gap-3 m-0 py-[2px] px-0
                          text-[13px] font-normal normal-case tracking-normal text-ink cursor-pointer">
                <input type="checkbox" id="theme-toggle" role="switch"
                       class="peer absolute top-0 left-0 w-[46px] h-[26px] m-0 opacity-0 cursor-pointer">
                <span aria-hidden="true"
                      class="relative flex-none w-[46px] h-[26px] rounded-full
                             bg-surface-active border border-border
                             transition-[background-color,border-color] duration-250 ease-[ease]
                             peer-checked:bg-accent peer-checked:border-accent
                             peer-focus-visible:outline-[1.5px] peer-focus-visible:outline-focus-ring
                             peer-focus-visible:outline-offset-2
                             peer-checked:[&_.thumb]:translate-x-5
                             peer-checked:[&_.moon]:opacity-0
                             peer-checked:[&_.moon]:rotate-90
                             peer-checked:[&_.moon]:scale-50
                             peer-checked:[&_.sun]:opacity-100
                             peer-checked:[&_.sun]:rotate-0
                             peer-checked:[&_.sun]:scale-100">
                    <span class="thumb absolute top-[2px] left-[2px] w-[22px] h-[22px] rounded-full
                                 bg-surface shadow-card ring-1 ring-border-strong
                                 transition-[translate,background-color] duration-250 ease-[var(--ease)]">
                        <span class="moon absolute inset-0 flex items-center justify-center text-ink
                                     transition-[opacity,rotate,scale] duration-250 ease-[var(--ease)]"><svg class="size-[15px] [stroke-width:2.6]" aria-hidden="true" focusable="false"><use href="img/icons.svg#moon"/></svg></span>
                        <span class="sun absolute inset-0 flex items-center justify-center text-ink
                                     opacity-0 rotate-[-90deg] scale-50
                                     transition-[opacity,rotate,scale] duration-250 ease-[var(--ease)]"><svg class="size-[15px] [stroke-width:2.6]" aria-hidden="true" focusable="false"><use href="img/icons.svg#sun"/></svg></span>
                    </span>
                </span>
                <span class="text-ink">Тёмная тема</span>
            </label>
        </div>

        <div class="flex flex-col gap-[10px]" id="gamble-section" hidden>
            <span class="flex items-center gap-[6px] text-[11px] font-semibold uppercase tracking-[0.08em] text-ink-secondary">
                <svg class="size-4 shrink-0 text-ink [stroke-width:2.1]" aria-hidden="true" focusable="false"><use href="img/icons.svg#dices"/></svg>Развлечения
            </span>
            <button id="gamble-btn" type="button"
                    class="w-full inline-flex items-center justify-center gap-2
                           min-h-11 py-[10px] px-4 rounded-control
                           text-[13px] font-semibold cursor-pointer
                           bg-accent text-on-accent border border-accent
                           transition-[background-color,border-color,scale] duration-150 ease-[ease]
                           active:enabled:scale-[0.98]
                           disabled:bg-surface-active disabled:text-ink-tertiary
                           disabled:border-border disabled:cursor-not-allowed
                           mouse:hover:enabled:bg-accent-hover mouse:hover:enabled:border-accent-hover
                           max-tab:min-h-12 max-tab:text-[14px]">
                <svg class="size-4 shrink-0 [stroke-width:2.1]" aria-hidden="true" focusable="false"><use href="img/icons.svg#dices"/></svg>Gamble
            </button>
        </div>


        <div class="mt-auto flex flex-col gap-3 max-tab:mt-2">
            <div class="sidebar-action relative flex">
                <input type="checkbox" id="schedule-toggle"
                       class="peer absolute inset-0 w-full h-full m-0 opacity-0 cursor-pointer">
                <label for="schedule-toggle"
                       class="flex items-center justify-center gap-2 w-full m-0 min-h-11 p-[10px] rounded-control
                              bg-surface text-ink border border-border-strong
                              text-[13px] font-medium leading-none tracking-normal normal-case
                              cursor-pointer
                              transition-[background-color,border-color] duration-150 ease-[ease]
                              mouse:hover:bg-surface-hover
                              peer-checked:bg-accent-soft peer-checked:border-accent
                              peer-focus-visible:outline-[1.5px] peer-focus-visible:outline-focus-ring
                              peer-focus-visible:outline-offset-2
                              [&_.hide]:hidden
                              peer-checked:[&_.show]:hidden peer-checked:[&_.hide]:inline-flex
                              max-tab:min-h-12">
                    <span class="show inline-flex items-center gap-2"><svg class="size-4 shrink-0 [stroke-width:2.1]" aria-hidden="true" focusable="false"><use href="img/icons.svg#chevron-up"/></svg>Показать расписание</span>
                    <span class="hide items-center gap-2"><svg class="size-4 shrink-0 [stroke-width:2.1]" aria-hidden="true" focusable="false"><use href="img/icons.svg#chevron-down"/></svg>Скрыть расписание</span>
                </label>
            </div>

            <button id="sidebar-close" type="button" aria-label="Закрыть меню"
                    class="inline-flex items-center justify-center gap-2 mt-0 w-full min-h-11 p-[10px] rounded-control
                           bg-danger text-on-danger border border-danger
                           text-[13px] font-medium leading-none cursor-pointer
                           transition-[background-color,border-color,scale] duration-150 ease-[ease]
                           active:scale-[0.98]
                           mouse:hover:bg-danger-hover mouse:hover:border-danger-hover
                           max-tab:min-h-12">
                <svg class="size-4 shrink-0 [stroke-width:2.1]" aria-hidden="true" focusable="false"><use href="img/icons.svg#x"/></svg>Закрыть
            </button>
        </div>
    </aside>

    <div id="sidebar-scrim" aria-hidden="true"
         class="fixed inset-0 z-14 bg-scrim opacity-0 pointer-events-none
                transition-opacity duration-[var(--duration-drawer-out)] ease-[var(--ease-drawer)]
                max-tab:sidebar-open:opacity-100 max-tab:sidebar-open:pointer-events-auto
                max-tab:sidebar-open:duration-[var(--duration-drawer-in)]"></div>

    <!-- основной контент -->
    <div id="app-wrapper"
         class="flex w-full h-full items-stretch justify-center p-4
                pl-[calc(var(--sidebar-width)_+_var(--sidebar-inset)*2)]
                max-tab:h-full max-tab:min-h-0
                max-tab:pl-2 max-tab:pr-2 max-tab:pb-2 max-tab:pt-[var(--mobile-top-bar)]
                max-phone:pl-1 max-phone:pr-1 max-phone:pb-1 max-phone:pt-[var(--mobile-top-bar)]
                short:h-auto short:min-h-screen
                short:pl-1 short:pr-1 short:pb-1 short:pt-[var(--mobile-top-bar)]">
        <div id="main-container"
             class="flex-1 max-w-[var(--content-max)] h-full flex flex-col gap-3 min-w-0
                    max-tab:max-w-full max-tab:gap-2">
            <div id="content-row"
                 class="flex-1 flex items-stretch gap-3 min-h-0
                        max-tab:flex-auto max-tab:flex-col max-tab:gap-2
                        short:gap-1">
                <div id="map-column"
                     class="flex-1 flex flex-col gap-3 min-w-0
                            max-tab:flex-auto max-tab:gap-2 max-tab:min-h-0">
                    <div id="model-container" aria-label="Интерактивный план этажа"
                         class="flex-auto w-full border border-border rounded-card bg-model-bg
                                relative overflow-hidden touch-none min-h-0
                                [&>canvas]:block [&>canvas]:w-full [&>canvas]:h-full
                                [&>canvas]:cursor-pointer [&>canvas:active]:cursor-grabbing
                                sheet-open:pointer-events-none
                                max-tab:sidebar-open:pointer-events-none

                                          self-stretch mt-1

                                          text-[11px] font-medium leading-[1.4] text-model-ink
                                          cursor-pointer select-none pointer-events-auto

                        <div id="debug-confirm" role="dialog" aria-modal="true" aria-labelledby="debug-confirm-text" hidden

                                <button id="debug-confirm-no" type="button"

                max-tab:left-0 max-tab:right-0 max-tab:max-w-none
                max-tab:px-3 max-tab:pb-[calc(var(--space-3)_+_env(safe-area-inset-bottom,0px))]

        </div>

             class="flex-auto w-full grid grid-cols-[repeat(auto-fill,minmax(210px,1fr))]

                    [&_.pair-room]:text-[11px] [&_.pair-room]:font-medium

                    [&_.pair-teacher]:before:size-[12px] [&_.pair-teacher]:before:shrink-0

                    [&_.pair-teacher]:before:[mask:var(--icon-teacher)_center/contain_no-repeat]

                       mouse:hover:bg-surface-hover mouse:hover:text-ink">
            <svg class="size-[18px] [stroke-width:1.9]" aria-hidden="true" focusable="false"><use href="img/icons.svg#x"/></svg>

        <button id="room-panel-back" type="button"

                    [&_p]:before:size-6 [&_p]:before:shrink-0
                    [&_p]:before:bg-ink-secondary
                    [&_p]:before:[mask:var(--icon-empty)_center/contain_no-repeat]

                    [&>.room-pair-item]:bg-bg [&>.room-pair-item]:rounded-control

                    [&>.room-pair-item]:border-l-[3px] [&>.room-pair-item]:text-ink
                    [&>.room-pair-item]:animate-[fade-item_var(--duration-base)_ease_both]

                    [&>.room-pair-item.upcoming]:border-l-status-upcoming

                    [&_.room-pair-teacher]:flex [&_.room-pair-teacher]:items-center
                    [&_.room-pair-teacher]:gap-[5px]
                    [&_.room-pair-teacher]:text-[11px] [&_.room-pair-teacher]:text-ink-tertiary
                    [&_.room-pair-teacher]:mt-[5px]
                    [&_.room-pair-teacher]:before:size-[12px] [&_.room-pair-teacher]:before:shrink-0
                    [&_.room-pair-teacher]:before:bg-ink-secondary
                    [&_.room-pair-teacher]:before:[mask:var(--icon-teacher)_center/contain_no-repeat]"></div>
    </div>
